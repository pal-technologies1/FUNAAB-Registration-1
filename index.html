
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="FUNAAB student registration page">

    <title>FUNAAB Student Registration</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- University Logo as Page Icon -->
    <link rel="icon" href="images/funaab-logo.png" type="image/png">
</head>

<body>

    <!-- Page Header -->
    <header class="site-header">

        <img
            src="images/funaab-logo.png"
            alt="Federal University of Agriculture, Abeokuta logo"
            class="university-logo"
        >

        <h1>Student Registration</h1>

        <p>
            Federal University of Agriculture, Abeokuta (FUNAAB)
        </p>

    </header>

    <!-- Main Content -->
    <main>

        <section class="registration-section">

            <div class="form-heading">
                <h2>Registration Form</h2>
                <p>Please fill in your details to register.</p>
            </div>

            <form id="registrationForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label for="name">Full Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <!-- Matric Number -->
                <div class="form-group">
                    <label for="matric">Matric No.</label>

                    <input
                        type="text"
                        id="matric"
                        name="matric"
                        placeholder="Enter your 8-digit matric number"
                        inputmode="numeric"
                        pattern="[0-9]{8}"
                        minlength="8"
                        maxlength="8"
                        title="Matric number must contain exactly 8 digits."
                        required
                    >

                    <small class="field-hint">
                        Enter exactly 8 digits.
                    </small>
                </div>

                <!-- Department -->
                <div class="form-group">
                    <label for="department">Department</label>

                    <select
                        id="department"
                        name="department"
                        required
                    >
                        <option value="">Select your department</option>

                        <option value="Information and Communication Technology">
                            Information and Communication Technology
                        </option>

                        <option value="Information Technology">
                            Information Technology
                        </option>

                        <option value="Computer Science">
                            Computer Science
                        </option>

                        <option value="Data Science">
                            Data Science
                        </option>

                        <option value="Information Systems">
                            Information Systems
                        </option>

                        <option value="CyberSecurity">
                            CyberSecurity
                        </option>

                        <option value="Software Engineering">
                            Software Engineering
                        </option>

                    </select>
                </div>

                <!-- Email Address -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email address"
                        autocomplete="email"
                        required
                    >
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label for="gender">Gender</label>

                    <select
                        id="gender"
                        name="gender"
                        required
                    >
                        <option value="">Select your gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>

                <!-- Phone Number -->
                <div class="form-group">
                    <label for="phone">Phone Number</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter your phone number"
                        autocomplete="tel"
                        required
                    >
                </div>

                <!-- Programme -->
                <div class="form-group">
                    <label for="program">Programme</label>

                    <select
                        id="program"
                        name="program"
                        required
                    >
                        <option value="">Select your programme</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Weekday">Weekday</option>
                        <option value="Weekends">Weekends</option>
                    </select>
                </div>

                <!-- Form Actions -->
                <div class="form-actions">

                    <button type="submit" id="registerButton">
                        Register
                    </button>

                    <button type="reset" id="resetButton">
                        Clear Form
                    </button>

                </div>

            </form>

            <!-- Registration Success Message -->
            <div
                id="successMessage"
                class="success-message"
                role="status"
                aria-live="polite"
                hidden
            >

                <div class="success-icon" aria-hidden="true">✓</div>

                <h2>Registration Successful!</h2>

                <p>
                    Your registration form has been completed successfully.
                </p>

                <button type="button" id="closeSuccess">
                    Continue
                </button>

            </div>

        </section>

    </main>

    <!-- Page Footer -->
    <footer class="site-footer">
        <p>&copy; Pal Technologies 2026</p>
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
